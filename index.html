<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>我的博客</title>
    <meta name="description" content="我的博客 —— 记录技术、思考与生活" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0b0f14" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%235aa8ff'/><text x='50' y='50' font-size='62' font-family='system-ui,sans-serif' font-weight='700' fill='%23fff' text-anchor='middle' dominant-baseline='central'>M</text></svg>" />
    <script>
      // 在首屏渲染前定好主题，避免暗色用户看到一闪而过的白底
      (function () {
        try {
          var saved = localStorage.getItem('blog-theme')
          var light = window.matchMedia('(prefers-color-scheme: light)').matches
          document.documentElement.setAttribute('data-theme', saved || (light ? 'light' : 'dark'))
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark')
        }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
