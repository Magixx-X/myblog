name: Deploy Blog

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          # Node 20 已 EOL，且旧版 action 运行在 node20 上会被 GitHub 警告弃用
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # 部署到 <user>.github.io/<repo>/ 时把 base 设为 /<repo>/
          # 这里由仓库名自动推导，用户主页仓库（<user>.github.io）除外
          VITE_BASE: /${{ github.event.repository.name }}/

      # enablement: true 让 action 在 Pages 尚未开启时自动创建站点
      # 注意：GitHub Free 账号的私有仓库不支持 Pages，仓库必须设为 Public
      - uses: actions/configure-pages@v6
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
